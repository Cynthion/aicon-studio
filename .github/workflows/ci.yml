name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run prettier:check

      - name: Lint
        run: npm run lint

      - name: Lint Markdown
        run: npm run docs:lint

      # The build is also the type check: there is no standalone typecheck script.
      - name: Build
        run: npm run build

      # The pipeline rasterizes with Playwright's headless Chromium, which `npm ci` does not download.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test
        run: npm test
