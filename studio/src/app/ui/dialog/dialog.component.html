<!-- the backdrop is a pointer affordance, the keyboard closes the dialog with Escape -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialog
  [attr.aria-labelledby]="headlineId"
  (mousedown)="press($event)"
  (click)="clickBackdrop($event)"
  (close)="closed.emit(dialog.returnValue)">
  <div class="body">
    <header>
      <h2 [id]="headlineId">{{ headline() }}</h2>
      <button
        type="button"
        class="icon"
        aria-label="Close"
        (click)="close()">
        ✕
      </button>
    </header>
    <ng-content />
  </div>
</dialog>
