<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1"
      name="viewport" />
    <title>Aicon Studio</title>
    <link
      rel="icon"
      href="data:," />
    <!-- Served by server.ts over the project folder. Reference: .documentation/tech/pipeline.md. -->
    <style>
      :root {
        --bg: #f4f7f6;
        --card: #ffffff;
        --fg: #17221f;
        --muted: #5d6a66;
        --line: #d9e2df;
        --accent: #0e8a73;
        --danger: #c0392b;
        --size: 32px;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bg: #121816;
        --card: #1b2422;
        --fg: #e9efed;
        --muted: #9eaca8;
        --line: #2b3734;
        --accent: #4fc6aa;
        --danger: #ef7a6d;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: var(--fg);
      }
      button {
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--card);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--card);
        font-weight: 600;
      }
      button.danger {
        color: var(--danger);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      code,
      pre,
      textarea {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        padding: 10px 16px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      .top h1 {
        margin: 0;
        font-size: 1.05rem;
      }
      .group {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .group > span {
        color: var(--muted);
        font-size: 12px;
        margin-right: 2px;
      }
      .spacer {
        flex: 1;
      }
      details.pop {
        position: relative;
      }
      details.pop > summary {
        list-style: none;
        cursor: pointer;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        user-select: none;
      }
      details.pop > summary::-webkit-details-marker {
        display: none;
      }
      details.pop > div {
        position: absolute;
        z-index: 6;
        top: calc(100% + 4px);
        left: 0;
        min-width: 220px;
        max-height: 60vh;
        overflow: auto;
        padding: 6px;
        display: grid;
        gap: 4px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.15);
        text-align: left;
      }
      details.pop.right > div {
        left: auto;
        right: 0;
      }
      details.pop > div button {
        text-align: left;
        border-color: transparent;
      }
      .job.running > summary {
        border-color: var(--accent);
        color: var(--accent);
      }
      .job.failed > summary {
        border-color: var(--danger);
        color: var(--danger);
      }
      main {
        display: flex;
        gap: 16px;
        padding: 16px;
        align-items: flex-start;
      }
      .wrap {
        flex: 1;
        min-width: 0;
        overflow: auto;
        max-height: calc(100vh - 96px);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
      }
      th,
      td {
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        text-align: center;
        vertical-align: middle;
      }
      thead th {
        position: sticky;
        top: 0;
        z-index: 3;
        background: var(--card);
        text-align: left;
        vertical-align: top;
      }
      th.stem {
        position: sticky;
        left: 0;
        z-index: 2;
        background: var(--card);
        text-align: left;
        font-weight: 400;
        min-width: 170px;
        max-width: 230px;
      }
      thead th.stem {
        z-index: 4;
      }
      th.stem span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      th.stem .reference {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--accent);
        --size: 16px;
      }
      .colhead {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        min-width: 120px;
      }
      .colhead > div:first-child {
        flex: 1;
      }
      .colhead b,
      .colhead span {
        display: block;
      }
      .colhead span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
      }
      .colhead span.badge {
        display: inline-block;
        margin-top: 2px;
        color: var(--card);
      }
      .badge {
        display: inline-block;
        padding: 0 6px;
        border-radius: 999px;
        font-size: 11px;
        background: var(--accent);
        color: var(--card);
      }
      .cell {
        border: 2px solid transparent;
        background: none;
        padding: 4px;
        border-radius: 8px;
        display: grid;
        justify-items: center;
        gap: 2px;
        margin: 0 auto;
      }
      .cell.selected {
        border-color: var(--accent);
      }
      .cell .badge {
        font-size: 10px;
      }
      .state {
        font-size: 11px;
        color: var(--muted);
      }
      td.failed .state {
        color: var(--danger);
      }
      td.pending .ic,
      td.drawing .ic {
        opacity: 0.3;
      }
      td.drawing .state {
        color: var(--accent);
      }
      .ic {
        display: inline-block;
        flex: none;
        width: var(--size);
        height: var(--size);
        background: currentColor;
        -webkit-mask: var(--src) center / contain no-repeat;
        mask: var(--src) center / contain no-repeat;
      }
      .ic.none {
        background: none;
        -webkit-mask: none;
        mask: none;
        position: relative;
      }
      .ic.none::after {
        content: '–';
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .pair {
        display: inline-flex;
        gap: 6px;
      }
      .pair.hover .filled,
      .cell:hover .pair.hover .outline,
      .pair.hover:hover .outline {
        display: none;
      }
      .cell:hover .pair.hover .filled,
      .pair.hover:hover .filled {
        display: inline-block;
      }
      aside {
        position: sticky;
        top: 72px;
        width: 560px;
        max-width: 45vw;
        max-height: calc(100vh - 96px);
        overflow: auto;
        padding: 16px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      aside header {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      aside h2 {
        margin: 0;
        font-size: 1.1rem;
      }
      .big {
        display: flex;
        gap: 12px;
        margin: 12px 0;
      }
      .big figure {
        margin: 0;
        flex: 1;
      }
      .frame {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        --size: 92%;
      }
      .frame svg {
        width: 92%;
        height: 92%;
        cursor: crosshair;
      }
      .frame svg path {
        fill: var(--fg);
      }
      .frame svg .marker {
        fill: var(--accent);
        stroke: var(--card);
      }
      figcaption {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .sizes {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: end;
      }
      .sizes > span {
        display: grid;
        justify-items: center;
        gap: 2px;
        font-size: 11px;
        color: var(--muted);
      }
      .sizes .pair {
        color: var(--fg);
      }
      .icon-list {
        width: 100%;
      }
      .icon-list td {
        text-align: left;
      }
      .subject {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        min-width: 360px;
      }
      .subject textarea {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        font-family: inherit;
        font-size: 14px;
        resize: vertical;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      pre {
        white-space: pre-wrap;
        background: var(--bg);
        padding: 8px;
        border-radius: 8px;
      }
      .styles {
        display: flex;
        gap: 16px;
        flex: 1;
        align-items: flex-start;
      }
      .styles nav {
        display: grid;
        gap: 4px;
        width: 200px;
      }
      .styles nav button {
        text-align: left;
      }
      .editor {
        flex: 1;
        display: grid;
        gap: 10px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      .editor textarea {
        width: 100%;
        min-height: 280px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
      }
      .editor input,
      select,
      input[type='search'] {
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--fg);
        width: min(480px, 92vw);
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.35);
      }
      dialog fieldset {
        border: 0;
        padding: 0;
        margin: 12px 0;
        display: grid;
        gap: 6px;
      }
      dialog label:has(input:not([type='checkbox'])) {
        display: grid;
        gap: 2px;
        font-size: 12px;
        color: var(--muted);
      }
      dialog input:not([type='checkbox']) {
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        font-size: 14px;
      }
      dialog menu {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 0;
      }
      #project-dialog [data-dir] {
        text-align: left;
      }
      #project-dialog .folder {
        display: flex;
        gap: 6px;
        align-items: end;
      }
      #project-dialog .folder label {
        flex: 1;
      }
      #toast {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9;
        padding: 8px 14px;
        border-radius: 8px;
        background: var(--fg);
        color: var(--bg);
        max-width: 90vw;
      }
      #toast.error {
        background: var(--danger);
        color: #fff;
      }
      @media (max-width: 900px) {
        main {
          flex-direction: column;
        }
        aside {
          position: static;
          width: 100%;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="top"
      class="top"></div>
    <main id="main"></main>
    <dialog id="run-dialog"></dialog>
    <dialog id="settings-dialog"></dialog>
    <dialog id="project-dialog"></dialog>
    <div
      role="status"
      hidden
      id="toast"></div>
    <script>
      // Cost estimates need both prices in Settings; a referenced icon goes through images/edits with its reference image.
      const prices = () =>
        S.settings.pricePlain !== undefined && S.settings.priceReferenced !== undefined
          ? { plain: S.settings.pricePlain, referenced: S.settings.priceReferenced }
          : null;
      const SIZES = [16, 24, 32, 48, 64];
      let S;
      const ui = (() => {
        const base = {
          view: 'sets',
          size: 32,
          theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
          pair: 'side',
          hidden: [],
          search: '',
          projects: []
        };
        try {
          return { ...base, ...JSON.parse(localStorage.getItem('aicon-studio') || '{}'), selected: null, draft: null };
        } catch {
          return { ...base, selected: null, draft: null };
        }
      })();
      const save = () => {
        try {
          const { view, size, theme, pair, hidden, projects } = ui;
          localStorage.setItem('aicon-studio', JSON.stringify({ view, size, theme, pair, hidden, projects }));
        } catch {}
      };
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      const money = (n) => `≈ $${n.toFixed(n < 0.1 ? 3 : 2)}`;
      /** The last segment of a folder path, the name the page shows for a project. */
      const folderName = (dir) => dir.split(/[\\/]/).filter(Boolean).pop() ?? dir;
      /** Puts the project first among the recent projects, kept with the other preferences of the page. */
      const remember = (dir) => {
        if (ui.projects[0] !== dir) {
          ui.projects = [dir, ...ui.projects.filter((d) => d !== dir)].slice(0, 8);
          save();
        }
      };
      const forget = (dir) => {
        ui.projects = ui.projects.filter((d) => d !== dir);
        save();
      };

      let toastTimer;
      const toast = (text, error = false) => {
        const el = document.getElementById('toast');
        el.textContent = text;
        el.className = error ? 'error' : '';
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.hidden = true), error ? 8000 : 3000);
      };
      const api = async (method, url, body) => {
        const res = await fetch(url, {
          method,
          // every write carries the JSON content type, which the server requires
          headers: method !== 'GET' ? { 'Content-Type': 'application/json' } : {},
          body: body ? JSON.stringify(body) : undefined
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) {
          toast(json.error || res.statusText, true);
          throw Object.assign(new Error(json.error), { status: res.status });
        }
        return json;
      };

      let timer;
      const refresh = async () => {
        S = await api('GET', '/api/state');
        remember(S.project);
        document.title = `${folderName(S.project)} · Aicon Studio`;
        render();
        clearTimeout(timer);
        if (S.job?.running) {
          timer = setTimeout(refresh, 2000);
        }
      };

      // ---- data helpers

      const drawnIcons = () => S.config.icons.filter((i) => i.subject);
      const referencedCount = () => drawnIcons().filter((i) => S.references[i.stem] !== undefined).length;
      /** The estimated cost of drawing the stems, or null without prices. */
      const costOf = (stems) => {
        const p = prices();
        return p ? stems.reduce((sum, s) => sum + (S.references[s] !== undefined ? p.referenced : p.plain), 0) : null;
      };
      /** The cost as a label suffix, empty without prices. */
      const cost = (stems) => (prices() ? ` (${money(costOf(stems))})` : '');
      const columns = () => [
        { id: 'icons', title: 'current icons', sub: S.target, base: '/files/icons/', files: S.icons, failed: [] },
        ...S.sets.map((s) => ({
          id: s.set,
          title: s.info.style,
          sub: s.info.run,
          base: `/files/sets/${s.set}/`,
          files: s.files,
          failed: s.info.failed,
          info: s.info
        }))
      ];
      const src = (col, file) => (col.files[file] !== undefined ? `${col.base}${file}.svg?v=${col.files[file]}` : null);
      const ic = (url, cls = '') => (url ? `<i class="ic ${cls}" style="--src:url('${url}')"></i>` : `<i class="ic none ${cls}"></i>`);
      const pair = (col, stem, mode = ui.pair) =>
        `<span class="pair ${mode}">${ic(src(col, stem), 'outline')}${ic(src(col, `${stem}-filled`), 'filled')}</span>`;
      const promptOf = (template, stem) => {
        const icon = S.config.icons.find((i) => i.stem === stem);
        const prompt = template.replaceAll('{subject}', icon?.subject ?? '');
        return S.references[stem] !== undefined ? `${prompt}\n\n${S.referencePrompt}` : prompt;
      };

      // ---- rendering

      /** The subject fields of the Icons view that hold an unsaved change. */
      const unsavedSubjects = () => [...document.querySelectorAll('[data-subject]')].filter((f) => f.value !== f.defaultValue);

      const render = () => {
        document.documentElement.dataset.theme = ui.theme;
        document.documentElement.style.setProperty('--size', `${ui.size}px`);
        renderTop();
        if (ui.view === 'sets' && !document.querySelector('#main details.pop[open]')) {
          renderSets();
        }
        if (ui.view === 'icons' && !unsavedSubjects().length && !document.activeElement?.matches('[data-subject]')) {
          renderIcons();
        }
      };

      const toggle = (group, value, current, label = value) =>
        `<button type="button" data-set="${group}" data-value="${value}" aria-pressed="${String(value) === String(current)}">${label}</button>`;

      const renderTop = () => {
        const job = S.job;
        let jobChip = '';
        if (job) {
          const failed = job.failed.length;
          const text = job.running
            ? `Drawing ${job.done}/${job.total}${failed ? ` · ${failed} failed` : ''}`
            : job.error
              ? `${job.kind} stopped: ${job.error}`
              : `${job.kind} done: ${job.done - failed} drawn${failed ? `, ${failed} failed` : ''}`;
          const list = [...job.drawing.map((d) => `drawing ${d}`), ...job.failed].map((l) => `<li>${esc(l)}</li>`).join('');
          jobChip = `<details class="pop right job ${job.running ? 'running' : failed || job.error ? 'failed' : ''}"><summary>${esc(text)}</summary><div><ul style="margin:0;padding-left:18px">${list || '<li>nothing to show</li>'}</ul></div></details>`;
        }
        const cols = columns()
          .map(
            (c) =>
              `<label><input type="checkbox" data-column="${esc(c.id)}" ${ui.hidden.includes(c.id) ? '' : 'checked'}> ${esc(c.id === 'icons' ? 'current icons' : c.id)}</label>`
          )
          .join('');
        document.getElementById('top').innerHTML = `
          <h1>Aicon Studio</h1>
          <button type="button" data-act="project">Project: ${esc(S.project)}</button>
          <span class="group">${toggle('view', 'sets', ui.view, 'Sets')}${toggle('view', 'icons', ui.view, 'Icons')}${toggle('view', 'styles', ui.view, 'Styles')}</span>
          ${
            ui.view === 'sets'
              ? `<span class="group"><span>Size</span>${SIZES.map((s) => toggle('size', s, ui.size)).join('')}</span>
                 <span class="group"><span>Filled</span>${toggle('pair', 'side', ui.pair, 'Beside')}${toggle('pair', 'hover', ui.pair, 'On hover')}</span>
                 <details class="pop"><summary>Columns</summary><div>${cols}</div></details>
                 <input type="search" id="search" placeholder="Filter icons" value="${esc(ui.search)}" aria-label="Filter icons">`
              : ''
          }
          <span class="group">${toggle('theme', 'light', ui.theme, 'Light')}${toggle('theme', 'dark', ui.theme, 'Dark')}</span>
          <span class="spacer"></span>
          ${jobChip}
          <button type="button" data-act="settings">Settings</button>
          <button type="button" class="primary" data-act="new-run" ${job?.running ? 'disabled' : ''}>New run</button>`;
      };

      const columnMenu = (c) => {
        const items = [];
        if (c.info) {
          if (c.failed.length) {
            items.push(`<button type="button" data-act="redraw-failed" data-col="${esc(c.id)}">Redraw ${c.failed.length} failed${cost(c.failed)}</button>`);
          }
          items.push(`<button type="button" data-act="style-from" data-col="${esc(c.id)}">New style from this prompt</button>`);
          items.push(`<button type="button" data-act="adopt" data-col="${esc(c.id)}">Adopt into ${esc(S.target)}…</button>`);
          items.push(`<button type="button" class="danger" data-act="delete-set" data-col="${esc(c.id)}">Delete set…</button>`);
        }
        return items.length
          ? `<details class="pop right"><summary aria-label="Actions for ${esc(c.id)}">⋯</summary><div>${items.join('')}</div></details>`
          : '';
      };

      const renderSets = () => {
        const cols = columns().filter((c) => !ui.hidden.includes(c.id));
        const query = ui.search.toLowerCase();
        const icons = S.config.icons.filter((i) => !query || `${i.stem} ${i.subject ?? ''}`.toLowerCase().includes(query));
        const running = S.job?.running ? S.job : null;
        const head = cols
          .map((c) => `<th><div class="colhead"><div><b>${esc(c.title)}</b><span>${esc(c.sub)}</span></div>${columnMenu(c)}</div></th>`)
          .join('');
        const rows = icons
          .map((i) => {
            const reference =
              S.references[i.stem] !== undefined
                ? `<span class="reference" title="Reference: later runs keep this composition">${ic(`/files/references/${i.stem}.svg?v=${S.references[i.stem]}`)} referenced</span>`
                : '';
            const label = `<th class="stem"><code>${esc(i.stem)}</code><span>${esc(i.subject ?? `rotation of ${i.from}`)}</span>${reference}</th>`;
            const cells = cols.map((c) => {
              const base = i.from ?? i.stem;
              const state = running?.drawing.includes(`${c.id}/${base}`)
                ? 'drawing'
                : c.failed.includes(base)
                  ? 'failed'
                  : c.files[i.stem] === undefined && running?.sets.includes(c.id)
                    ? 'pending'
                    : '';
              const selected = ui.selected?.col === c.id && ui.selected?.stem === i.stem;
              const isReference = S.referencedIn[i.stem]?.includes(c.id);
              return `<td class="${state}"><button type="button" class="cell${selected ? ' selected' : ''}" data-col="${esc(c.id)}" data-stem="${esc(i.stem)}" aria-label="${esc(i.stem)} in ${esc(c.id)}${isReference ? ', the reference' : ''}">${pair(c, i.stem)}${state ? `<span class="state">${state}</span>` : ''}${isReference ? '<span class="badge" title="This drawing is the reference: later runs keep its composition">reference</span>' : ''}</button></td>`;
            });
            return `<tr>${label}${cells.join('')}</tr>`;
          })
          .join('');
        const main = document.getElementById('main');
        const scroll = main.querySelector('.wrap') && [main.querySelector('.wrap').scrollLeft, main.querySelector('.wrap').scrollTop];
        main.innerHTML = `<div class="wrap"><table><thead><tr><th class="stem">Icon</th>${head}</tr></thead><tbody>${rows}</tbody></table></div><aside id="drawer" hidden></aside>`;
        if (scroll) {
          [main.querySelector('.wrap').scrollLeft, main.querySelector('.wrap').scrollTop] = scroll;
        }
        renderDrawer();
      };

      const renderDrawer = async () => {
        const el = document.getElementById('drawer');
        const col = columns().find((c) => c.id === ui.selected?.col);
        const icon = S.config.icons.find((i) => i.stem === ui.selected?.stem);
        if (!el || !col || !icon) {
          ui.selected = null;
          return;
        }
        const stem = icon.stem;
        const drawn = !!icon.subject;
        const inSet = !!col.info;
        const referenced = S.references[stem] !== undefined;
        const isReference = S.referencedIn[stem]?.includes(col.id);
        const flips = col.info?.flips?.[stem] ?? [];
        const drawnFrom = col.info?.icons.find((i) => i.stem === stem)?.subject;
        const canFlip = inSet && drawn && col.files[stem] !== undefined;
        const busy = !!S.job?.running;
        const actions = [];
        if (!drawn) {
          actions.push(
            `<button type="button" data-act="select" data-col="${esc(col.id)}" data-stem="${esc(icon.from)}">Open ${esc(icon.from)}: reference, flip and redraw there</button>`
          );
        } else {
          if (col.files[stem] !== undefined && !isReference) {
            actions.push(
              `<button type="button" data-act="reference" data-col="${esc(col.id)}" data-stem="${esc(stem)}">${referenced ? 'Replace the reference with this drawing' : 'Use as reference'}</button>`
            );
          }
          if (referenced) {
            actions.push(`<button type="button" data-act="unreference" data-stem="${esc(stem)}">Remove reference</button>`);
          }
          if (col.files[stem] !== undefined) {
            actions.push(
              `<button type="button" data-act="describe" data-col="${esc(col.id)}" data-stem="${esc(stem)}">Write subject from this drawing</button>`
            );
          }
          if (inSet) {
            actions.push(
              `<button type="button" data-act="redraw" data-col="${esc(col.id)}" data-stem="${esc(stem)}" ${busy ? 'disabled' : ''}>Redraw${cost([stem])}</button>`
            );
          }
          if (flips.length) {
            actions.push(
              `<button type="button" data-act="undo-flip" data-col="${esc(col.id)}" data-stem="${esc(stem)}" title="⌘Z / Ctrl+Z" ${busy ? 'disabled' : ''}>Undo last flip</button>`,
              `<button type="button" data-act="reset-flips" data-col="${esc(col.id)}" data-stem="${esc(stem)}" ${busy ? 'disabled' : ''}>Reset ${flips.length} flip${flips.length > 1 ? 's' : ''}</button>`
            );
          }
        }
        el.hidden = false;
        el.innerHTML = `
          <header><div><h2>${esc(stem)}</h2><span class="muted">${esc(col.id === 'icons' ? 'current icons' : col.id)}</span>${isReference ? ' <span class="badge">reference</span>' : ''}</div><button type="button" data-act="close" aria-label="Close">✕</button></header>
          <div class="big">
            <figure><div class="frame">${ic(src(col, stem))}</div><figcaption>Outline</figcaption></figure>
            <figure><div class="frame" id="flip">${ic(src(col, `${stem}-filled`))}</div><figcaption id="flip-caption">${canFlip ? 'Filled · click a region to switch it between filled and white' : 'Filled'}</figcaption></figure>
          </div>
          <div class="sizes">${SIZES.slice()
            .reverse()
            .map((s) => `<span style="--size:${s}px">${pair(col, stem, 'side')}${s}</span>`)
            .join('')}
            <span style="--size:48px">${pair(col, stem, 'hover')}hover</span></div>
          ${
            !drawn
              ? `<p>Rotation of ${esc(icon.from)}.</p>`
              : drawnFrom
                ? `<p><span class="muted">Drawn from:</span> ${esc(drawnFrom)}${drawnFrom !== icon.subject ? ' <span class="muted">· the subject has changed since, see Icons</span>' : ''}</p>`
                : ''
          }
          ${col.info ? `<details><summary>Prompt of this set</summary><pre>${esc(promptOf(col.info.prompt, stem))}</pre></details>` : ''}
          <div class="actions">${actions.join('')}</div>`;
        if (!canFlip) {
          return;
        }
        // the filled icon inline, so a click maps to its viewBox units
        const url = src(col, `${stem}-filled`);
        const markup = await (await fetch(url)).text();
        const frame = document.getElementById('flip');
        if (!frame || src(col, `${stem}-filled`) !== url) {
          return;
        }
        frame.innerHTML = markup;
        const svg = frame.querySelector('svg');
        const side = Number(svg.getAttribute('viewBox').split(' ')[2]);
        for (const [x, y] of flips) {
          const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          Object.entries({ 'cx': x, 'cy': y, 'r': side * 0.014, 'stroke-width': side * 0.004, 'class': 'marker' }).forEach(([k, v]) => dot.setAttribute(k, v));
          svg.append(dot);
        }
        svg.addEventListener('click', (e) => {
          const point = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
          setFlips(col.id, stem, [...flipsOf(col.id, stem), [Math.round(point.x * 10) / 10, Math.round(point.y * 10) / 10]]);
        });
      };

      const renderIcons = () => {
        const current = columns()[0];
        const rows = S.config.icons
          .map((i) => {
            const subject = i.subject
              ? `<div class="subject"><textarea data-subject="${esc(i.stem)}" rows="2" spellcheck="false" aria-label="Subject of ${esc(i.stem)}">${esc(i.subject)}</textarea><button type="button" data-act="save-subject" data-stem="${esc(i.stem)}" disabled>Save</button></div>`
              : `<span class="muted">Rotation of ${esc(i.from)}</span>`;
            const holders = (S.referencedIn[i.stem] ?? []).map((c) => (c === 'icons' ? 'current icons' : c)).join(', ');
            const reference =
              S.references[i.stem] !== undefined
                ? `<div class="group">${ic(`/files/references/${i.stem}.svg?v=${S.references[i.stem]}`)}<span>${esc(holders || 'in no set')}</span><button type="button" data-act="unreference" data-stem="${esc(i.stem)}">Remove reference</button></div>`
                : '';
            return `<tr><td>${pair(current, i.stem, 'side')}</td><td><code>${esc(i.stem)}</code></td><td>${subject}</td><td>${reference}</td></tr>`;
          })
          .join('');
        document.getElementById('main').innerHTML = `<div class="wrap"><table class="icon-list">
          <thead><tr><th>Current</th><th>Name</th><th>Subject <small class="muted">replaces {subject} in every style prompt of the next run or redraw · ⌘Enter saves</small></th><th>Reference <small class="muted">chosen in Sets</small></th></tr></thead>
          <tbody>${rows}</tbody></table></div>`;
      };

      const renderStyles = () => {
        const draft = ui.draft;
        const list = S.styles
          .map(
            (s) =>
              `<button type="button" data-act="edit-style" data-name="${esc(s.name)}" aria-pressed="${draft && !draft.isNew && draft.name === s.name}">${esc(s.name)}</button>`
          )
          .join('');
        const stems = drawnIcons()
          .map((i) => `<option ${draft?.previewStem === i.stem ? 'selected' : ''}>${esc(i.stem)}</option>`)
          .join('');
        document.getElementById('main').innerHTML = `
          <div class="styles">
            <nav>${list}<button type="button" data-act="new-style">+ New style</button></nav>
            ${
              draft
                ? `<section class="editor">
                    <label>Name <input id="style-name" value="${esc(draft.name)}" ${draft.isNew ? '' : 'disabled'} pattern="[a-z0-9-]+" aria-describedby="name-hint"></label>
                    <small class="muted" id="name-hint">Lowercase letters, digits and dashes; it names the set directories.</small>
                    <label>Prompt <small class="muted">({subject} is replaced by each icon's subject)</small>
                      <textarea id="style-prompt" spellcheck="false">${esc(draft.prompt)}</textarea></label>
                    <div class="actions">
                      <button type="button" class="primary" data-act="save-style">Save</button>
                      ${draft.isNew ? '' : '<button type="button" data-act="duplicate-style">Duplicate</button><button type="button" class="danger" data-act="delete-style">Delete…</button>'}
                    </div>
                    <label>Preview for <select id="preview-stem">${stems}</select></label>
                    <pre id="preview"></pre>
                  </section>`
                : '<section class="editor"><p class="muted">Choose a style to edit it, or create a new one.</p></section>'
            }
          </div>`;
        updatePreview();
      };
      const updatePreview = () => {
        const pre = document.getElementById('preview');
        if (pre) {
          pre.textContent = promptOf(document.getElementById('style-prompt').value, document.getElementById('preview-stem').value);
        }
      };

      const openRunDialog = () => {
        const dialog = document.getElementById('run-dialog');
        dialog.innerHTML = `<form method="dialog">
          <h2 style="margin-top:0">New run</h2>
          <p class="muted">Every icon is drawn once per chosen style, each style into its own set. Referenced icons keep the composition of their reference.</p>
          <fieldset><legend>Styles</legend>${S.styles
            .map((s) => `<label><input type="checkbox" name="style" value="${esc(s.name)}"> ${esc(s.name)}</label>`)
            .join('')}</fieldset>
          <label>Quality <select name="quality">${['low', 'medium', 'high']
            .map((q) => `<option ${q === S.config.quality ? 'selected' : ''}>${q}</option>`)
            .join('')}</select></label>
          <p id="run-summary"></p>
          <menu><button value="cancel" formnovalidate>Cancel</button><button value="start" class="primary" id="run-start">Start run</button></menu>
        </form>`;
        const summary = () => {
          const styles = [...dialog.querySelectorAll('[name=style]:checked')].length;
          const icons = drawnIcons().length;
          const referenced = referencedCount();
          const total = costOf(drawnIcons().map((i) => i.stem));
          dialog.querySelector('#run-summary').textContent = styles
            ? `${icons} icons × ${styles} style${styles > 1 ? 's' : ''} = ${icons * styles} images, ${referenced * styles} of them referenced${total === null ? '' : `: ${money(total * styles)}`}.`
            : 'Choose at least one style.';
          dialog.querySelector('#run-start').disabled = !styles;
        };
        dialog.addEventListener('change', summary);
        summary();
        dialog.onclose = async () => {
          if (dialog.returnValue !== 'start') {
            return;
          }
          const styles = [...dialog.querySelectorAll('[name=style]:checked')].map((b) => b.value);
          await api('POST', '/api/runs', { styles, quality: dialog.querySelector('[name=quality]').value });
          toast('Run started');
          await refresh();
        };
        dialog.returnValue = '';
        dialog.showModal();
      };

      const openSettingsDialog = () => {
        const dialog = document.getElementById('settings-dialog');
        const s = S.settings;
        const field = (name, label, type, value, extra = '') =>
          `<label>${label}<input name="${name}" type="${type}" value="${esc(value ?? '')}" spellcheck="false" ${extra}></label>`;
        dialog.innerHTML = `<form method="dialog">
          <h2 style="margin-top:0">Settings</h2>
          <p class="muted">Stored for you alone, outside the project folder. The key is never shown again.</p>
          <fieldset>
            ${field('baseUrl', 'Base URL of an OpenAI-compatible API', 'url', s.baseUrl, 'placeholder="https://…/v1" required')}
            ${field('apiKey', 'API key', 'password', '', s.hasApiKey ? 'placeholder="stored, leave empty to keep it"' : 'required')}
            ${field('imageModel', 'Image model', 'text', s.imageModel, 'required')}
            ${field('describeModel', 'Describe model, a chat model with image input', 'text', s.describeModel, 'required')}
            ${field('pricePlain', 'Price per plain image, in $', 'number', s.pricePlain, 'min="0" step="0.001"')}
            ${field('priceReferenced', 'Price per referenced image, in $', 'number', s.priceReferenced, 'min="0" step="0.001"')}
          </fieldset>
          <p class="muted">The prices only drive the cost estimates; leave both empty to hide them.</p>
          <menu><button value="cancel" formnovalidate>Cancel</button><button value="save" class="primary">Save</button></menu>
        </form>`;
        dialog.onclose = async () => {
          if (dialog.returnValue !== 'save') {
            return;
          }
          const form = new FormData(dialog.querySelector('form'));
          const number = (name) => (form.get(name) === '' ? undefined : Number(form.get(name)));
          await api('PUT', '/api/settings', {
            baseUrl: form.get('baseUrl'),
            apiKey: form.get('apiKey'),
            imageModel: form.get('imageModel'),
            describeModel: form.get('describeModel'),
            pricePlain: number('pricePlain'),
            priceReferenced: number('priceReferenced')
          });
          toast('Saved the settings');
          await refresh();
        };
        dialog.returnValue = '';
        dialog.showModal();
      };

      const openProjectDialog = () => {
        const dialog = document.getElementById('project-dialog');
        const recent = ui.projects.filter((d) => d !== S.project);
        dialog.innerHTML = `<form method="dialog">
          <h2 id="project-title" style="margin-top:0">Project</h2>
          <p class="muted">The folder that holds aicon-studio.json. Opening another one switches every view to it; the settings stay.</p>
          ${
            recent.length
              ? `<fieldset><legend>Recent</legend>${recent.map((d) => `<button type="button" data-dir="${esc(d)}">${esc(d)}</button>`).join('')}</fieldset>`
              : ''
          }
          <div class="folder">
            <label>Folder<input name="dir" value="${esc(S.project)}" spellcheck="false" required></label>
            <button type="button" data-browse>Browse…</button>
          </div>
          <menu><button value="cancel" formnovalidate>Cancel</button><button value="open" class="primary">Open</button></menu>
        </form>`;
        dialog.setAttribute('aria-labelledby', 'project-title');
        const input = dialog.querySelector('[name=dir]');
        dialog.querySelectorAll('[data-dir]').forEach((b) =>
          b.addEventListener('click', () => {
            input.value = b.dataset.dir;
            dialog.close('open');
          })
        );
        const browse = dialog.querySelector('[data-browse]');
        browse.addEventListener('click', async () => {
          browse.disabled = true;
          try {
            const { dir } = await api('POST', '/api/pick-folder');
            if (dir) {
              input.value = dir;
            }
          } catch {
            // shown by api()
          } finally {
            browse.disabled = false;
          }
        });
        dialog.onclose = async () => {
          if (dialog.returnValue !== 'open') {
            return;
          }
          const dir = input.value.trim();
          try {
            await api('PUT', '/api/project', { dir });
          } catch (e) {
            if (e.status === 400) {
              forget(dir);
            }
            return;
          }
          ui.selected = null;
          ui.draft = null;
          ui.hidden = [];
          ui.search = '';
          save();
          await refresh();
          toast(`Opened ${S.project}`);
        };
        dialog.returnValue = '';
        dialog.showModal();
      };

      const flipsOf = (col, stem) => S.sets.find((s) => s.set === col)?.info.flips?.[stem] ?? [];
      let deriving = false;
      /** Stores the flips of an icon and derives its fill. Input during a derivation is ignored: it would build on a stale list. */
      const setFlips = async (col, stem, points) => {
        if (S.job?.running) {
          return toast('Wait for the drawing job to finish', true);
        }
        if (deriving) {
          return;
        }
        deriving = true;
        const caption = document.getElementById('flip-caption');
        if (caption) {
          caption.textContent = 'Deriving the fill…';
        }
        try {
          await api('PUT', '/api/flips', { set: col, stem, points });
          await refresh();
        } finally {
          deriving = false;
        }
      };
      /** Drops the newest flip of an icon; the fill is derived from the remaining ones, so it returns to the state before it. */
      const undoFlip = (col, stem) => {
        const flips = flipsOf(col, stem);
        return flips.length ? setFlips(col, stem, flips.slice(0, -1)) : undefined;
      };

      const saveSubject = async (stem) => {
        const field = document.querySelector(`[data-subject="${stem}"]`);
        const subject = field.value.trim();
        if (!subject) {
          return toast('A subject must not be empty', true);
        }
        await api('PUT', `/api/subjects/${stem}`, { subject });
        field.defaultValue = field.value;
        field.closest('tr').querySelector('[data-act="save-subject"]').disabled = true;
        field.closest('td').querySelector('.saved')?.remove();
        toast(`Saved the subject of ${stem}; the next run or redraw draws from it`);
        return refresh();
      };

      /** Opens the Icons view with a written subject in the field of its icon, unsaved, beside the saved one. */
      const suggestSubject = (stem, subject, col) => {
        if (ui.view !== 'icons') {
          ui.view = 'icons';
          save();
          render();
        }
        const field = document.querySelector(`[data-subject="${stem}"]`);
        const cell = field.closest('td');
        cell.querySelector('.saved')?.remove();
        cell.insertAdjacentHTML('beforeend', `<small class="muted saved">Saved: ${esc(field.defaultValue)}</small>`);
        field.value = subject;
        field.dispatchEvent(new Event('input', { bubbles: true }));
        field.scrollIntoView({ block: 'center' });
        field.focus();
        toast(`Wrote a subject for ${stem} from ${col === 'icons' ? 'the current icon' : col}: review it and Save`);
      };

      // ---- events

      document.addEventListener('click', async (e) => {
        const set = e.target.closest('[data-set]');
        if (set) {
          if (set.dataset.set === 'view' && unsavedSubjects().length && !confirm('Discard the unsaved subjects?')) {
            return;
          }
          const value = set.dataset.value;
          ui[set.dataset.set] = set.dataset.set === 'size' ? Number(value) : value;
          save();
          if (set.dataset.set === 'view' && value === 'styles') {
            renderTop();
            return renderStyles();
          }
          return render();
        }
        const cell = e.target.closest('.cell');
        if (cell) {
          ui.selected = { col: cell.dataset.col, stem: cell.dataset.stem };
          document.querySelectorAll('.cell.selected').forEach((c) => c.classList.remove('selected'));
          cell.classList.add('selected');
          return renderDrawer();
        }
        const button = e.target.closest('[data-act]');
        if (!button) {
          return;
        }
        const { act, col, stem, name } = button.dataset;
        const info = S.sets.find((s) => s.set === col)?.info;
        button.closest('details')?.removeAttribute('open');
        switch (act) {
          case 'new-run':
            return openRunDialog();
          case 'close':
            ui.selected = null;
            return render();
          case 'select':
            ui.selected = { col, stem };
            return render();
          case 'reference':
            await api('PUT', `/api/references/${stem}`, { set: col });
            toast(`${stem} is now the reference: later runs keep this composition`);
            return refresh();
          case 'describe': {
            button.disabled = true;
            button.textContent = 'Writing subject…';
            const { subject } = await api('POST', '/api/describe', { set: col, stem }).finally(() => {
              button.disabled = false;
              button.textContent = 'Write subject from this drawing';
            });
            return suggestSubject(stem, subject, col);
          }
          case 'unreference':
            await api('DELETE', `/api/references/${stem}`);
            toast(`Removed the reference of ${stem}`);
            return refresh();
          case 'save-subject':
            return saveSubject(stem);
          case 'redraw':
            await api('POST', '/api/redraw', { set: col, stems: [stem] });
            return refresh();
          case 'redraw-failed':
            await api('POST', '/api/redraw', { set: col, stems: info.failed });
            return refresh();
          case 'undo-flip':
            return undoFlip(col, stem);
          case 'reset-flips':
            return setFlips(col, stem, []);
          case 'project':
            return openProjectDialog();
          case 'settings':
            return openSettingsDialog();
          case 'adopt':
            if (confirm(`Copy every SVG of ${col} into ${S.target}, overwriting the files there?`)) {
              await api('POST', '/api/adopt', { set: col });
              toast(`Adopted ${col}`);
              return refresh();
            }
            return;
          case 'delete-set':
            if (confirm(`Delete the set ${col} and all its files?`)) {
              await api('DELETE', `/api/sets/${col}`);
              ui.selected = null;
              return refresh();
            }
            return;
          case 'style-from':
            ui.view = 'styles';
            ui.draft = { name: `${info.style}-2`, prompt: info.prompt, isNew: true };
            renderTop();
            return renderStyles();
          case 'edit-style': {
            const style = S.styles.find((s) => s.name === name);
            ui.draft = { name: style.name, prompt: style.prompt, isNew: false };
            return renderStyles();
          }
          case 'new-style':
            ui.draft = { name: '', prompt: '# New Style\n\nCreate a minimal UI icon of {subject} in …', isNew: true };
            return renderStyles();
          case 'duplicate-style':
            ui.draft = { name: `${ui.draft.name}-2`, prompt: document.getElementById('style-prompt').value, isNew: true };
            return renderStyles();
          case 'save-style': {
            const styleName = document.getElementById('style-name').value.trim();
            const prompt = document.getElementById('style-prompt').value;
            if (!/^[a-z0-9-]+$/.test(styleName)) {
              return toast('The name takes lowercase letters, digits and dashes', true);
            }
            if (ui.draft.isNew && S.styles.some((s) => s.name === styleName)) {
              return toast(`A style ${styleName} exists already`, true);
            }
            await api('PUT', `/api/styles/${styleName}`, { prompt });
            S = await api('GET', '/api/state');
            ui.draft = { name: styleName, prompt: prompt.trim(), isNew: false };
            toast(`Saved ${styleName}`);
            return renderStyles();
          }
          case 'delete-style':
            if (confirm(`Delete the style ${ui.draft.name}? Its sets stay.`)) {
              await api('DELETE', `/api/styles/${ui.draft.name}`);
              S = await api('GET', '/api/state');
              ui.draft = null;
              return renderStyles();
            }
            return;
        }
      });
      document.addEventListener('change', (e) => {
        if (e.target.dataset.column) {
          const id = e.target.dataset.column;
          ui.hidden = e.target.checked ? ui.hidden.filter((h) => h !== id) : [...ui.hidden, id];
          save();
          return renderSets();
        }
        if (e.target.id === 'preview-stem') {
          updatePreview();
        }
      });
      document.addEventListener('input', (e) => {
        if (e.target.id === 'search') {
          ui.search = e.target.value;
          renderSets();
        }
        if (e.target.id === 'style-prompt') {
          updatePreview();
        }
        if (e.target.dataset.subject) {
          e.target.closest('tr').querySelector('[data-act="save-subject"]').disabled = !e.target.value.trim() || e.target.value === e.target.defaultValue;
        }
      });
      document.addEventListener('keydown', (e) => {
        const subject = e.target.dataset?.subject;
        if (subject && e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.value !== e.target.defaultValue) {
          e.preventDefault();
          return saveSubject(subject);
        }
        if (e.key === 'z' && (e.metaKey || e.ctrlKey) && !e.shiftKey && ui.selected && !e.target.closest('input, textarea')) {
          e.preventDefault();
          return undoFlip(ui.selected.col, ui.selected.stem);
        }
        if (e.key === 'Escape' && ui.selected) {
          ui.selected = null;
          render();
        }
      });

      refresh().then(() => ui.view === 'styles' && renderStyles());
    </script>
  </body>
