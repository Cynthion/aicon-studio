@if (next(); as next) {
  <ol aria-label="Setup">
    @for (step of steps(); track step.key) {
      <li [class.done]="step.done">
        @if (step.key === next.key) {
          <button
            type="button"
            class="primary"
            (click)="go(step)">
            Next: {{ step.label }}
          </button>
        } @else {
          <span
            class="mark"
            aria-hidden="true">
            {{ step.done ? '✓' : '○' }}
          </span>
          {{ step.label }}
          <span class="visually-hidden">{{ step.done ? 'done' : 'open' }}</span>
        }
      </li>
    }
  </ol>
}
